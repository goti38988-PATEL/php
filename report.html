<!DOCTYPE html>
<html>
<head>
<title>Reports - VConnect IT</title>

<style>

body{
margin:0;
font-family:Segoe UI;
background:#f4f7fa;
}

.header{
background:#0f172a;
color:white;
padding:20px;
}

.container{
padding:30px;
}

.cards{
display:flex;
flex-wrap:wrap;
gap:20px;
}

.card{
background:white;
width:220px;
padding:20px;
border-radius:10px;
box-shadow:0px 3px 10px rgba(0,0,0,0.1);
}

.card h2{
color:#2563eb;
margin:0;
}

table{
width:100%;
margin-top:30px;
background:white;
border-collapse:collapse;
box-shadow:0px 3px 10px rgba(0,0,0,0.1);
}

th{
background:#2563eb;
color:white;
padding:15px;
}

td{
padding:15px;
border-bottom:1px solid #ddd;
}

</style>
</head>

<body>

<div class="header">
<h1>Reports Dashboard</h1>
</div>

<div class="container">

<div class="cards">

<div class="card">
<h2>156</h2>
<p>Total Tickets</p>
</div>

<div class="card">
<h2>18</h2>
<p>Open Tickets</p>
</div>

<div class="card">
<h2>138</h2>
<p>Resolved Tickets</p>
</div>

<div class="card">
<h2>24</h2>
<p>Total Clients</p>
</div>

<div class="card">
<h2>12</h2>
<p>AMC Clients</p>
</div>

<div class="card">
<h2>?2,45,000</h2>
<p>Monthly Revenue</p>
</div>

</div>

<table>

<tr>
<th>Engineer</th>
<th>Assigned</th>
<th>Resolved</th>
<th>Pending</th>
</tr>

<tr>
<td>Varun Patel</td>

</tr>

<tr>

</tr>

<tr>
<td>Amit Shah</td>

</tr>

</table>

</div>

</body>
</html>
